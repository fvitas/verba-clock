<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Verba — app icon / logo alternatives</title>
<style>
  body { background: #1c1a18; color: #d8d4cf; font-family: -apple-system, sans-serif; padding: 2rem; max-width: 1300px; }
  h1, h2 { font-weight: 500; }
  .option { margin-bottom: 3rem; border-top: 1px solid #3a3733; padding-top: 1.4rem; }
  .sizes { display: flex; gap: 2.5rem; align-items: flex-end; flex-wrap: wrap; }
  .size { text-align: center; }
  .size .label { font-size: .75rem; color: #9a958e; margin-top: .5rem; }
  .size svg { display: block; border-radius: 18%; box-shadow: 0 10px 25px rgba(0,0,0,.5); }
  ul { font-size: .9rem; line-height: 1.5; }
  .pro::before { content: "✓ "; color: #7fbf7f; }
  .con::before { content: "✗ "; color: #bf7f7f; }
  .homerow { display: flex; gap: 1rem; align-items: center; background: #0e0d0c; padding: 1rem 1.4rem; border-radius: 10px; margin-top: 1rem; width: fit-content; }
  .homerow span { font-size: .7rem; color: #9a958e; }
</style>
</head>
<body>
<h1>Verba — app icon alternatives</h1>
<p>Each option rendered at 512 (store), 180 (home screen), 64 and 32 (favicon/tab). The real test is the 32px cell — that's what most people see daily.</p>
<div id="options"></div>

<script>
const GRID_ROWS = ['KLOSAMTREN','AMODESATRI','VERBAMDESET','CETIRPESTO','RDEVETOSAM'];

function faintGrid(litRow) {
  const ys = [122, 210, 298, 386, 474];
  return GRID_ROWS.slice(0, 5).map((row, i) => {
    const lit = i === 2 && litRow;
    const text = i === 2 ? 'VERBA' : row.slice(0, 10);
    return `<text x="256" y="${ys[i]}" fill="#ffffff" fill-opacity="${lit ? 1 : 0.13}"
      font-size="64" letter-spacing="8" text-anchor="middle"
      font-family="Helvetica, Arial, sans-serif" font-weight="500">${lit ? 'VERBA' : text}</text>`;
  }).join('');
}

function cornerDots(r, inset, on) {
  const p = inset, q = 512 - inset;
  return [[p,p],[q,p],[q,q],[p,q]].map(([x,y], i) =>
    `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffffff" fill-opacity="${i < on ? 1 : 0.13}"/>`
  ).join('');
}

const OPTIONS = [
  {
    id: 'A', title: 'Option A — current: word grid, VERBA row lit',
    svg: `<rect width="512" height="512" fill="#0a0a0a"/>${faintGrid(true)}`,
    pros: ['Literal miniature of the product', 'Distinct at large sizes'],
    cons: ['Unreadable below 64px — at 32px it is a dark square with a white smudge', 'Text-heavy icons are against both store guidelines'],
  },
  {
    id: 'B', title: 'Option B — single V over the faint grid',
    svg: `<rect width="512" height="512" fill="#0a0a0a"/>${faintGrid(false)}
      <text x="256" y="368" fill="#ffffff" font-size="330" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="500">V</text>`,
    pros: ['Legible at every size incl. 16px tab', 'Keeps the letter-grid identity as texture', 'Standard app-icon practice: one glyph'],
    cons: ['Generic letter mark — V alone is less distinctive'],
  },
  {
    id: 'C', title: 'Option C — V + four corner minute dots',
    svg: `<rect width="512" height="512" fill="#0a0a0a"/>
      <text x="256" y="368" fill="#ffffff" font-size="330" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="500">V</text>
      ${cornerDots(14, 52, 4)}`,
    pros: ['Corner dots are the QLOCKTWO signature — instantly "word clock" to anyone who knows the product', 'Clean and legible at all sizes', 'Dots survive even 32px'],
    cons: ['No grid texture — plainer at 512px'],
  },
  {
    id: 'D', title: 'Option D — grid + VERBA lit + corner dots',
    svg: `<rect width="512" height="512" fill="#0a0a0a"/>${faintGrid(true)}${cornerDots(14, 52, 4)}`,
    pros: ['Most faithful: face + dots, exactly the app', 'Best-looking at store size (512)'],
    cons: ['Same 32px illegibility as A', 'Busiest composition'],
  },
];

const root = document.getElementById('options');
for (const o of OPTIONS) {
  const div = document.createElement('div');
  div.className = 'option';
  const svg = (px) => `<svg width="${px}" height="${px}" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">${o.svg}</svg>`;
  div.innerHTML = `<h2>${o.title}</h2>
    <div class="sizes">
      <div class="size">${svg(256)}<div class="label">512 (store, shown ½)</div></div>
      <div class="size">${svg(180)}<div class="label">180 home screen</div></div>
      <div class="size">${svg(64)}<div class="label">64</div></div>
      <div class="size">${svg(32)}<div class="label">32 favicon</div></div>
    </div>
    <ul>${o.pros.map((p) => `<li class="pro">${p}</li>`).join('')}${o.cons.map((c) => `<li class="con">${c}</li>`).join('')}</ul>`;
  root.appendChild(div);
}
</script>
</body>
</html>
