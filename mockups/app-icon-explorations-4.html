<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Verba — round 4: kept 1 & 2, totally new ideas 3+</title>
<style>
  body { background: #1c1a18; color: #d8d4cf; font-family: -apple-system, sans-serif; padding: 2rem; max-width: 1400px; }
  h1 { font-weight: 500; }
  h2.group { font-weight: 500; margin-top: 3rem; border-bottom: 1px solid #3a3733; padding-bottom: .4rem; color: #b98a4a; }
  h2.group .kept { color: #7fbf7f; font-size: .8rem; margin-left: .8rem; }
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 2rem; }
  .option { background: #14120f; border-radius: 12px; padding: 1.2rem 1.4rem; }
  .option h3 { font-weight: 500; margin: 0 0 .8rem; font-size: 1rem; }
  .sizes { display: flex; gap: 1.2rem; align-items: flex-end; }
  .size { text-align: center; }
  .size .label { font-size: .7rem; color: #9a958e; margin-top: .4rem; }
  .size svg { display: block; border-radius: 18%; box-shadow: 0 8px 20px rgba(0,0,0,.5); }
  .note { font-size: .82rem; color: #9a958e; line-height: 1.45; margin-top: .8rem; }
</style>
</head>
<body>
<h1>Round 4 — families 1 & 2 kept, families 3–6 are totally new</h1>
<p><strong>1</strong> = zoomed grid + VERBA (locked from round 3). <strong>2</strong> = NOW family restored from round 2.
<strong>3 Light play · 4 Motion · 5 Bold graphic · 6 Playful</strong> — all new, tuned for eye-catch. Sizes 220 / 64 / 32.</p>
<div id="root"></div>

<script>
const EN = ['ITLISASAMPM','ACQUARTERDC','TWENTYFIVEX','HALFSTENFTO','PASVERBAINE','ONESIXTHREE','FOURFIVETWO','EIGHTELEVEN','SEVENTWELVE','TENSEOCLOCK'];
const EN_ORIG = EN.map((r, i) => i === 4 ? 'PASTERUNINE' : r);
const NOWROWS = EN.map((r, i) => i === 4 ? 'PASTNOWNINE' : r);
const FONT = 'font-family="Helvetica, Arial, sans-serif" font-weight="500" text-anchor="middle"';
const PAD = 56, SPAN = 400, CW = SPAN / 11, RH = SPAN / 10;
const X = (c) => (PAD + (c + 0.5) * CW).toFixed(1);
const Y = (r) => (PAD + (r + 0.5) * RH + 10.5).toFixed(1);

function cellsG(rows, isLit, { faint = 0.13, faintFill = '#fff', litFill = '#fff', pad = 56 } = {}) {
  const nR = rows.length, nC = [...rows[0]].length;
  const span = 512 - 2 * pad, cw = span / nC, rh = span / nR;
  const fs = Math.min(cw, rh) * 0.72;
  let dim = '', lit = '';
  rows.forEach((row, r) => [...row].forEach((ch, c) => {
    const x = (pad + (c + 0.5) * cw).toFixed(1), y = (pad + (r + 0.5) * rh + fs * 0.35).toFixed(1);
    const t = `<text x="${x}" y="${y}" font-size="${fs.toFixed(0)}">${ch}</text>`;
    if (isLit && isLit(r, c)) lit += t; else dim += t;
  }));
  return { dim: `<g ${FONT} fill="${faintFill}" fill-opacity="${faint}">${dim}</g>`,
           lit: lit ? `<g ${FONT} fill="${litFill}">${lit}</g>` : '' };
}

const glow = (u, inner, dev = 7) =>
  `<filter id="${u}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${dev}"/></filter>
   <g filter="url(#${u}b)" opacity="0.85">${inner}</g>${inner}`;

const DARK = '<rect width="512" height="512" fill="#0a0a0a"/>';
const nowLit = (r, c) => r === 4 && c >= 4 && c <= 6;
const dots = (on, fill = '#fff') => {
  const p = 40, q = 512 - 40;
  return [[p,p],[q,p],[q,q],[p,q]].map(([x,y], i) =>
    `<circle cx="${x}" cy="${y}" r="11" fill="${fill}" fill-opacity="${i < on ? 1 : 0.13}"/>`).join('');
};

const HEART = new Set(['1:2','1:3','1:7','1:8','2:1','2:4','2:6','2:9','3:1','3:5','3:9','4:2','4:8','5:3','5:7','6:4','6:6','7:5']);
const BOLT = new Set(['0:6','1:5','1:6','2:5','3:4','3:5','3:6','3:7','4:5','4:6','5:5','6:4','6:5','7:4','8:3','8:4','9:3']);

const OPTIONS = [
  { group: '1 — kept ✓ zoomed grid + VERBA', id: '1c', title: '1c — 5 rows, VERBA lit, no glow (revised)',
    note: 'Per feedback: flat white VERBA, no glow — crisper, easier to read. Other rows faint. Dark twin of 5c1.',
    svg(u) { const g = cellsG(['TWENT','QUART','VERBA','SEVEN','CLOCK'], (r) => r === 2, { pad: 66 });
      return DARK + g.dim + g.lit; } },

  { group: '2 — restored ✓ NOW family (round 2)', id: '2a', title: '2a — NOW small, 6% grid',
    note: 'Quiet, philosophical.',
    svg(u) { const g = cellsG(NOWROWS, nowLit, { faint: 0.06 }); return DARK + g.dim + glow(u, g.lit, 8); } },
  { group: '2 — restored ✓ NOW family (round 2)', id: '2b', title: '2b — giant NOW',
    note: 'The statement, loud. Grid whispers at 5%.',
    svg(u) { const g = cellsG(EN_ORIG, null, { faint: 0.05 }); return DARK + g.dim +
      glow(u, `<text x="256" y="310" ${FONT} font-size="150" letter-spacing="6" fill="#fff">NOW</text>`, 9); } },
  { group: '2 — restored ✓ NOW family (round 2)', id: '2c', title: '2c — NOW + corner dots',
    note: 'Anchors the corners, claims the QLOCKTWO signature.',
    svg(u) { const g = cellsG(NOWROWS, nowLit, { faint: 0.06 }); return DARK + g.dim + glow(u, g.lit, 8) + dots(4); } },
  { group: '2 — restored ✓ NOW family (round 2)', id: '2d', title: '2d — NOW in amber',
    note: 'Candle in the dark.',
    svg(u) { const g = cellsG(NOWROWS, nowLit, { faint: 0.06, litFill: '#ffb54d' }); return DARK + g.dim + glow(u, g.lit, 9); } },
  { group: '2 — restored ✓ NOW family (round 2)', id: '2e', title: '2e — IT IS NOW',
    note: 'Row 0’s authentic IT IS lit together with NOW.',
    svg(u) { const g = cellsG(NOWROWS, (r, c) => (r === 0 && [0,1,3,4].includes(c)) || nowLit(r, c), { faint: 0.08 });
      return DARK + g.dim + glow(u, g.lit, 7); } },
  { group: '2 — restored ✓ NOW family (round 2)', id: '2f', title: '2f — pure black, only light',
    note: 'Three letters glowing in a void.',
    svg(u) { return DARK + glow(u, `<text x="256" y="298" ${FONT} font-size="118" letter-spacing="10" fill="#fff">NOW</text>`, 10); } },

  { group: '3 — Light play (new)', id: '3a', title: '3a — one lit letter',
    note: 'A vast dark matrix, a single V burning. Loneliest, most intriguing icon on any shelf — begs to be tapped.',
    svg(u) { const g = cellsG(EN, (r, c) => r === 2 && c === 8, { faint: 0.07 }); return DARK + g.dim + glow(u, g.lit, 12); } },

  { group: '3 — Light play (new)', id: '3b', title: '3b — light beam sweep',
    note: 'A diagonal beam sweeps the matrix; letters ignite only where it passes. Feels like a lighthouse over words.',
    svg(u) {
      let dim = '', lit = '';
      EN.forEach((row, r) => [...row].forEach((ch, c) => {
        const d = Math.abs(r + c - 9);
        const t = (op) => `<text x="${X(c)}" y="${Y(r)}" font-size="30" fill-opacity="${op}">${ch}</text>`;
        if (d <= 2) lit += t((1 - d * 0.3).toFixed(2)); else dim += t(0.08);
      }));
      return DARK + `<g ${FONT} fill="#fff">${dim}</g>` +
        `<rect x="-80" y="230" width="900" height="150" fill="#fff" opacity="0.06" transform="rotate(-42 256 256)"/>` +
        glow(u, `<g ${FONT} fill="#fff">${lit}</g>`, 6); } },

  { group: '3 — Light play (new)', id: '3c', title: '3c — neon sign VERBA',
    note: 'VERBA as a pink neon tube over the dark grid — bar-sign energy, instantly eye-catching in a store list.',
    svg(u) { const g = cellsG(EN_ORIG, null, { faint: 0.07 });
      const neon = `<text x="256" y="300" ${FONT} font-size="110" letter-spacing="8" fill="none" stroke="#ff5fc0" stroke-width="4">VERBA</text>`;
      return DARK + g.dim + glow(u, neon, 9); } },

  { group: '3 — Light play (new)', id: '3d', title: '3d — starburst on the lit word',
    note: 'VERBA lit with a 4-point star flaring on one letter — the “ping” moment when the minute changes.',
    svg(u) { const g = cellsG(EN, (r, c) => r === 4 && c >= 3 && c <= 7, { faint: 0.1 });
      const star = `<path d="M330 216 L336 186 L342 216 L372 222 L342 228 L336 258 L330 228 L300 222 Z" fill="#fff"/>`;
      return DARK + g.dim + glow(u, g.lit, 5) + glow(u + 's', star, 4); } },

  { group: '4 — Motion (new)', id: '4a', title: '4a — letterfall',
    note: 'The word came apart — V E R B A tumble down the icon, still glowing. Playful, kinetic, unlike anything in the category.',
    svg(u) {
      const g = cellsG(EN.slice(0, 2), null, { faint: 0.1, pad: 56 });
      const fall = [['V',150,240,-16],['E',242,320,12],['R',330,270,-9],['B',205,420,20],['A',356,430,-24]]
        .map(([ch, x, y, a]) => `<text x="${x}" y="${y}" ${FONT} font-size="86" fill="#fff" transform="rotate(${a} ${x} ${y})">${ch}</text>`).join('');
      return DARK + `<g transform="translate(0 -20)">${g.dim}</g>` + glow(u, fall, 6); } },

  { group: '4 — Motion (new)', id: '4b', title: '4b — time spiral',
    note: 'Letters spiral into the center, brightening as they approach — time falling into now. Hypnotic.',
    svg(u) {
      const word = 'VERBAWORDCLOCKVERBAWORD';
      let txt = '';
      for (let i = 0; i < word.length; i++) {
        const a = i * 0.52, r = 195 - i * 7.4;
        const x = (256 + r * Math.cos(a)).toFixed(1), y = (256 + r * Math.sin(a)).toFixed(1);
        txt += `<text x="${x}" y="${y}" font-size="${(20 + i * 1.1).toFixed(0)}" fill-opacity="${(0.15 + i * 0.037).toFixed(2)}">${word[i]}</text>`;
      }
      return DARK + glow(u, `<g ${FONT} fill="#fff">${txt}</g>`, 5); } },

  { group: '4 — Motion (new)', id: '4c', title: '4c — hourglass of letters',
    note: 'Lit cells form an hourglass through the matrix — the oldest symbol of time, drawn in the newest way.',
    svg(u) {
      const hg = (r, c) => { const w = [5,4,3,2,1,1,2,3,4,5][r]; return Math.abs(c - 5) < w && (r <= 1 || r >= 8 || Math.abs(c - 5) === w - 1); };
      const g = cellsG(EN, hg, { faint: 0.09 });
      return DARK + g.dim + glow(u, g.lit, 4); } },

  { group: '5 — Bold graphic (new)', id: '5a', title: '5a — art word clock: rows 1/3/5 lit',
    note: 'Like family 1 but three lit rows — and they read as a sentence: WORDS · VERBA · CLOCK. Rows 2/4 stay faint.',
    svg(u) { const g = cellsG(['WORDS','QUART','VERBA','SEVEN','CLOCK'], (r) => r % 2 === 0, { pad: 66 });
      return DARK + g.dim + glow(u, g.lit, 6); } },

  { group: '5 — Bold graphic (new)', id: '5b', title: '5b — synthwave horizon',
    note: 'Deep purple → hot orange gradient behind the dark matrix, VERBA blazing white. Loudest color story possible while keeping the grid.',
    svg(u) { const g = cellsG(EN, (r, c) => r === 4 && c >= 3 && c <= 7, { faintFill: '#0a0a14', faint: 0.55 });
      return `<defs><linearGradient id="${u}g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#170533"/><stop offset=".55" stop-color="#6d1e5c"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient></defs>
        <rect width="512" height="512" fill="url(#${u}g)"/>${g.dim}${glow(u, g.lit, 8)}`; } },

  { group: '5 — Bold graphic (new)', id: '5c1', title: '5c1 — white, 5×5, black VERBA (light others)',
    note: 'Revised per feedback: white icon, black text, 5 rows, VERBA in the middle. Others at 22% black.',
    svg(u) { const g = cellsG(['TWENT','QUART','VERBA','SEVEN','CLOCK'], (r) => r === 2, { pad: 66, faintFill: '#111', faint: 0.22, litFill: '#111' });
      return `<rect width="512" height="512" fill="#f7f4ef"/>` + g.dim + g.lit; } },

  { group: '5 — Bold graphic (new)', id: '5c2', title: '5c2 — white, 5×5, all-black text',
    note: 'Same, but every letter solid black at 55% — VERBA reads by full contrast, page-of-type feel.',
    svg(u) { const g = cellsG(['TWENT','QUART','VERBA','SEVEN','CLOCK'], (r) => r === 2, { pad: 66, faintFill: '#111', faint: 0.55, litFill: '#000' });
      return `<rect width="512" height="512" fill="#f7f4ef"/>` + g.dim + g.lit; } },

  { group: '5 — Bold graphic (new)', id: '5c3', title: '5c3 — white, 5 wide rows from the real face',
    note: 'Full 11-column width, 5 authentic rows, VERBA black in the middle — closest to the actual clock, on paper instead of night.',
    svg(u) { const g = cellsG(['TWENTYFIVEX','HALFSTENFTO','PASVERBAINE','ONESIXTHREE','FOURFIVETWO'], (r, c) => r === 2 && c >= 3 && c <= 7, { pad: 52, faintFill: '#111', faint: 0.25, litFill: '#111' });
      return `<rect width="512" height="512" fill="#f7f4ef"/>` + g.dim + g.lit; } },

  { group: '5 — Bold graphic (new)', id: '5d', title: '5d — rainbow rows',
    note: 'Each row faintly tinted its own hue, VERBA glowing white through the spectrum — the 22 languages as 10 colors.',
    svg(u) {
      let txt = '';
      EN.forEach((row, r) => [...row].forEach((ch, c) => {
        if (r === 4 && c >= 3 && c <= 7) return;
        txt += `<text x="${X(c)}" y="${Y(r)}" font-size="30" fill="hsl(${r * 36} 80% 65%)" fill-opacity="0.35">${ch}</text>`;
      }));
      const lit = `<g ${FONT} fill="#fff">` + [3,4,5,6,7].map((c) => `<text x="${X(c)}" y="${Y(4)}" font-size="30">${'VERBA'[c-3]}</text>`).join('') + '</g>';
      return DARK + `<g ${FONT}>${txt}</g>` + glow(u, lit, 6); } },

  { group: '6 — Playful (new)', id: '6a', title: '6a — the clock looks back',
    note: 'Two lit letters as eyes, a lit arc as a smile — the matrix has a face. Maximum charm; kids’ pick.',
    svg(u) { const g = cellsG(EN_ORIG, (r, c) => (r === 3 && (c === 3 || c === 7)) || (r === 6 && c >= 4 && c <= 6) || (r === 5 && (c === 3 || c === 7)), { faint: 0.1 });
      return DARK + g.dim + glow(u, g.lit, 6); } },

  { group: '6 — Playful (new)', id: '6b', title: '6b — heart of letters',
    note: 'Lit cells form a heart through the grid — “love this time”. Extremely giftable / shareable energy.',
    svg(u) { const g = cellsG(EN_ORIG, (r, c) => HEART.has(r + ':' + c), { faint: 0.1 });
      return DARK + g.dim + glow(u, g.lit, 5); } },

  { group: '6 — Playful (new)', id: '6c', title: '6c — lightning through the words',
    note: 'A bolt of lit letters strikes through the matrix — energy, speed, the flash of the minute changing.',
    svg(u) { const g = cellsG(EN_ORIG, (r, c) => BOLT.has(r + ':' + c), { faint: 0.1 });
      return DARK + g.dim + glow(u, g.lit, 5); } },
];

const root = document.getElementById('root');
let currentGroup = '';
let board = null;
for (const o of OPTIONS) {
  if (o.group !== currentGroup) {
    currentGroup = o.group;
    const h = document.createElement('h2');
    h.className = 'group';
    h.textContent = currentGroup;
    root.appendChild(h);
    board = document.createElement('div');
    board.className = 'board';
    root.appendChild(board);
  }
  const inner = o.svg('u' + o.id);
  const svg = (px) => `<svg width="${px}" height="${px}" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  const div = document.createElement('div');
  div.className = 'option';
  div.innerHTML = `<h3>${o.title}</h3>
    <div class="sizes">
      <div class="size">${svg(220)}<div class="label">220</div></div>
      <div class="size">${svg(64)}<div class="label">64</div></div>
      <div class="size">${svg(32)}<div class="label">32</div></div>
    </div>
    <p class="note">${o.note}</p>`;
  board.appendChild(div);
}
</script>
</body>
</html>
