<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Verba — final icon candidates, versions 1–5</title>
<style>
  body { background: #1c1a18; color: #d8d4cf; font-family: -apple-system, sans-serif; padding: 2rem; max-width: 1400px; }
  h1 { font-weight: 500; }
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 2rem; margin-top: 2rem; }
  .option { background: #14120f; border-radius: 12px; padding: 1.4rem 1.6rem; }
  .option h3 { font-weight: 500; margin: 0 0 1rem; font-size: 1.05rem; }
  .sizes { display: flex; gap: 1.4rem; align-items: flex-end; }
  .size { text-align: center; }
  .size .label { font-size: .7rem; color: #9a958e; margin-top: .4rem; }
  .size svg { display: block; border-radius: 18%; box-shadow: 0 8px 20px rgba(0,0,0,.5); }
  .note { font-size: .85rem; color: #9a958e; line-height: 1.5; margin-top: .9rem; }
</style>
</head>
<body>
<h1>Final candidates — versions 1–5</h1>
<p>Everything distilled from four exploration rounds. Sizes 256 / 128 / 64 / 32.</p>
<div class="board" id="root"></div>

<script>
const ROWS5 = ['TWENT','QUART','VERBA','SEVEN','CLOCK'];
const ROWS5A = ['WORDS','QUART','VERBA','SEVEN','CLOCK'];
const EN_ORIG = ['ITLISASAMPM','ACQUARTERDC','TWENTYFIVEX','HALFSTENFTO','PASTERUNINE','ONESIXTHREE','FOURFIVETWO','EIGHTELEVEN','SEVENTWELVE','TENSEOCLOCK'];
const NOWROWS = EN_ORIG.map((r, i) => i === 4 ? 'PASTNOWNINE' : r);
const FONT = 'font-family="Helvetica, Arial, sans-serif" font-weight="500" text-anchor="middle"';

function cellsG(rows, isLit, { faint = 0.13, faintFill = '#fff', litFill = '#fff', pad = 56 } = {}) {
  const nR = rows.length, nC = [...rows[0]].length;
  const span = 512 - 2 * pad, cw = span / nC, rh = span / nR;
  const fs = Math.min(cw, rh) * 0.72;
  let dim = '', lit = '';
  rows.forEach((row, r) => [...row].forEach((ch, c) => {
    const x = (pad + (c + 0.5) * cw).toFixed(1), y = (pad + (r + 0.5) * rh + fs * 0.35).toFixed(1);
    const t = `<text x="${x}" y="${y}" font-size="${fs.toFixed(0)}">${ch}</text>`;
    if (isLit && isLit(r, c)) lit += t; else dim += t;
  }));
  return { dim: `<g ${FONT} fill="${faintFill}" fill-opacity="${faint}">${dim}</g>`,
           lit: lit ? `<g ${FONT} fill="${litFill}">${lit}</g>` : '' };
}

const glow = (u, inner, dev = 7) =>
  `<filter id="${u}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${dev}"/></filter>
   <g filter="url(#${u}b)" opacity="0.85">${inner}</g>${inner}`;

const DARK = '<rect width="512" height="512" fill="#0a0a0a"/>';

const OPTIONS = [
  { id: '1', title: 'Version 1 — VERBA, dark (no glow)',
    note: '5 rows, flat white VERBA in the middle, others faint. Crisp at every size. The quiet classic.',
    svg(u) { const g = cellsG(ROWS5, (r) => r === 2, { pad: 66 }); return DARK + g.dim + g.lit; } },

  { id: '2', title: 'Version 2 — VERBA, white (light twin)',
    note: 'Same geometry on paper-white with black text — the only light icon in the category; stands out in search lists. Pairs with V1 as iOS light/dark mode icons.',
    svg(u) { const g = cellsG(ROWS5, (r) => r === 2, { pad: 66, faintFill: '#111', faint: 0.22, litFill: '#111' });
      return `<rect width="512" height="512" fill="#f7f4ef"/>` + g.dim + g.lit; } },

  { id: '3', title: 'Version 3 — ART centered',
    note: 'ART between fillers (M/K), WORDS and CLOCK full rows. Faint HOURS / LIGHT.',
    svg(u) { const g = cellsG(['MARTK','HOURS','WORDS','LIGHT','CLOCK'],
      (r, c) => (r === 0 && c >= 1 && c <= 3) || r === 2 || r === 4, { pad: 66 });
      return DARK + g.dim + g.lit; } },

  { id: '3L1', title: '3L-1 — ARTKM (neutral fillers)',
    note: 'K M — pure word-clock fillers, no meaning, like the real faces.',
    svg(u) { const g = cellsG(['ARTKM','HOURS','WORDK','LIGHT','CLOCK'],
      (r, c) => (r === 0 && c <= 2) || (r === 2 && c <= 3) || r === 4, { pad: 66, faint: 0.32 });
      return DARK + g.dim + g.lit; } },

  { id: '3L2', title: '3L-2 — ✓ CHOSEN — ART OF / HOURS / WORDS / LIGHT / CLOCK',
    note: 'Final: ART, WORD, CLOCK lit; OF, HOURS, S, LIGHT dim at 32%. Every letter belongs to a word — “art of hours, words, light, clock”.',
    svg(u) { const g = cellsG(['ARTOF','HOURS','WORDS','LIGHT','CLOCK'],
      (r, c) => (r === 0 && c <= 2) || (r === 2 && c <= 3) || r === 4, { pad: 66, faint: 0.32 });
      return DARK + g.dim + g.lit; } },

  { id: '3L3', title: '3L-3 — ARTSY (real word)',
    note: 'Row 0 is a real word, ART lit inside ARTSY.',
    svg(u) { const g = cellsG(['ARTSY','HOURS','WORDK','LIGHT','CLOCK'],
      (r, c) => (r === 0 && c <= 2) || (r === 2 && c <= 3) || r === 4, { pad: 66, faint: 0.32 });
      return DARK + g.dim + g.lit; } },

  { id: '3L4', title: '3L-4 — EARTH (ART inside)',
    note: 'Row 0 is EARTH with ART lit in its middle — QLOCKTWO’s wall clock line is literally named EARTH. Breaks strict left-align by one cell.',
    svg(u) { const g = cellsG(['EARTH','HOURS','WORDK','LIGHT','CLOCK'],
      (r, c) => (r === 0 && c >= 1 && c <= 3) || (r === 2 && c <= 3) || r === 4, { pad: 66, faint: 0.32 });
      return DARK + g.dim + g.lit; } },

  { id: '4', title: 'Version 4 — giant NOW',
    note: 'The philosophical statement, loud. Full matrix whispering behind at 5%.',
    svg(u) { const g = cellsG(EN_ORIG, null, { faint: 0.05 }); return DARK + g.dim +
      glow(u, `<text x="256" y="310" ${FONT} font-size="150" letter-spacing="6" fill="#fff">NOW</text>`, 9); } },

  { id: '5', title: 'Version 5 — NOW inside the matrix',
    note: 'The full authentic 11×10 face with only NOW lit — quiet, honest, the app as it is.',
    svg(u) { const g = cellsG(NOWROWS, (r, c) => r === 4 && c >= 4 && c <= 6, { faint: 0.1 });
      return DARK + g.dim + glow(u, g.lit, 6); } },
];

const root = document.getElementById('root');
for (const o of OPTIONS) {
  const inner = o.svg('u' + o.id);
  const svg = (px) => `<svg width="${px}" height="${px}" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  const div = document.createElement('div');
  div.className = 'option';
  div.innerHTML = `<h3>${o.title}</h3>
    <div class="sizes">
      <div class="size">${svg(256)}<div class="label">256</div></div>
      <div class="size">${svg(128)}<div class="label">128</div></div>
      <div class="size">${svg(64)}<div class="label">64</div></div>
      <div class="size">${svg(32)}<div class="label">32</div></div>
    </div>
    <p class="note">${o.note}</p>`;
  root.appendChild(div);
}
</script>
</body>
</html>
